<title>見積もりクエスト — 木曜の野望</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:#000;color:#fff;
  font-family:'MS Gothic','Osaka-Mono','Hiragino Kaku Gothic ProN',monospace;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;}
body{display:flex;justify-content:center;}
#wrap{width:100%;max-width:420px;background:#000;min-height:100vh;padding:6px 6px 12px;}

.win{border:3px solid #fff;border-radius:6px;background:#000;padding:6px 8px;margin-bottom:6px;}

#top{display:flex;gap:6px;}
#stat{flex:1;font-size:12.5px;line-height:1.6;}
#stat .v{float:right;}
#stat .low{color:#ff8a7a;}
#chain{width:100px;font-size:10px;line-height:1.42;color:#8a8a8a;white-space:nowrap;}
#chain .on{color:#ffe14a;}
#chain .dn{color:#7fd6a2;}

#scene{border:3px solid #fff;border-radius:6px;background:#000;margin-bottom:6px;overflow:hidden;}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;}

#msg{min-height:122px;font-size:13.5px;line-height:1.62;cursor:pointer;}
#msg p{margin-bottom:1px;}
#msg .dmg{color:#ffe14a;}
#msg .crit{color:#ff9a4a;}
#msg .bad{color:#ff8a7a;}
#msg .good{color:#7fd6a2;}
#msg .sp{color:#c9a6ff;}
#msg .sys{color:#9a9a9a;}
#msg .yen{color:#8ad0ff;}
#nx{text-align:right;font-size:11px;height:14px;color:#9a9a9a;}
#nx.on:after{content:'▼';animation:bl .7s infinite;}
@keyframes bl{50%{opacity:.15;}}

#cmd{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.it{padding:7px 4px 7px 19px;font-size:13.5px;position:relative;cursor:pointer;color:#fff;}
.it:active:before,.it.sel:before{content:'▶';position:absolute;left:4px;color:#ffe14a;}
.it .c{float:right;font-size:10.5px;color:#9a9a9a;padding-right:3px;}
.it.no{color:#5a5a5a;pointer-events:none;}
.it.wide{grid-column:1 / -1;}
#cmd.off{opacity:.25;}
#cmd.off .it{pointer-events:none;}
#cmd.sp .it{font-size:11.5px;padding:6px 2px 6px 15px;}

#veil{position:fixed;inset:0;background:#000;z-index:9;display:flex;
  align-items:center;justify-content:center;padding:14px;}
#veil.hide{display:none;}
#vin{max-width:400px;width:100%;max-height:96vh;overflow-y:auto;border:3px solid #fff;
  border-radius:6px;padding:14px;font-size:13px;line-height:1.78;}
#vin h2{font-size:19px;text-align:center;letter-spacing:2px;margin-bottom:10px;color:#ffe14a;}
#vin p{margin-bottom:8px;}
#vin .rank{font-size:24px;color:#ffe14a;text-align:center;letter-spacing:4px;margin:10px 0;}
#vin table{width:100%;font-size:12.5px;border-collapse:collapse;margin:6px 0 10px;}
#vin td{border-bottom:1px solid #444;padding:3px 5px;}
#vin td:last-child{text-align:right;color:#ffe14a;}
#vin .sp{color:#c9a6ff;}
.big{width:100%;padding:10px;background:#000;border:3px solid #fff;border-radius:6px;
  color:#ffe14a;font-size:15px;letter-spacing:3px;cursor:pointer;font-family:inherit;margin-top:8px;}
.big:active{background:#222;}
</style>
</head>

  var n=0,i; for(i=0;i<ENEMIES.length;i++) if(!ENEMIES[i].cele) n++; return n;
}

function procList(sep){
  var a=[],i; for(i=0;i<ENEMIES.length;i++) if(!ENEMIES[i].cele) a.push(ENEMIES[i].short);
  return a.join(sep||'・');
}

/* =========================================================================
   画面
   ========================================================================= */
function flush(){
  var t=el('txt'); if(!t) return;
  t.innerHTML='';
  var n=0;
  while(G.q.length && n<5){
    if(G.q[0][0].indexOf('__')===0) break;
    var L=G.q.shift();
    var p=document.createElement('p'); p.className=L[0]||''; p.textContent=L[1];
    t.appendChild(p); n++;
  }
  var nx=el('nx'); if(nx) nx.className=G.q.length?'on':'';
  var c=el('cmd');
  if(c) c.className='win'+((G.q.length||(G.mode!=='cmd'&&G.mode!=='sub'))?' off':'')
                     +((G.mode==='sub'&&G.sub==='spell')?' sp':'');
}
function render(){
  var E=ENEMIES[Math.min(G.ei,ENEMIES.length-1)];
  var s=el('stat');
  if(s){
    /* お誕生日ラウンドだけ ゲージ名と 向きが変わる（よろこびは 積み上がる） */
    var gnm=E.gauge||'なっとく';
    var gv=E.cele?Math.max(0,E.hp-Math.max(0,G.ehp)):Math.max(0,G.ehp);
    s.innerHTML='<div>ミヤカワ</div>'
     +'<div class="'+(G.ara<=35?'low':'')+'">あらり<span class="v">'+Math.max(0,G.ara)+'</span></div>'
     +'<div>こんきょ<span class="v">'+Math.max(0,G.mp)+'</span></div>'
     +'<div style="color:'+(E.cele?'#ffd24a':'#9a9a9a')+'">'+gnm+'<span class="v">'+gv+'</span></div>'
     +(G.help?'<div style="color:#ff8a7a">応援<span class="v">'+(G.help===1?'カチョウ':'カチョウ+ブチョウ')+'</span></div>':'');
  }
  var ch=el('chain');
  if(ch){
    var h='<div style="color:#9a9a9a">みつもり</div>';
    for(var i=0;i<ENEMIES.length;i++){
      var cls=(i<G.ei)?'dn':((i===G.ei&&!G.over)?'on':'');
      var snm=(ENEMIES[i].secret && i>G.ei)?'？？？':ENEMIES[i].short;
      h+='<div class="'+cls+'">'+(i<G.ei?'✓':'・')+snm+'</div>';
    }
    ch.innerHTML=h;
  }
  if(FX.mode!=='die' && FX.mode!=='cele') CUR=(G.over||!G.showEnemy)?null:E;
  drawScene();
  renderCmd();
}
function renderCmd(){
  var c=el('cmd'); if(!c) return;
  var h='',i,E=ENEMIES[Math.min(G.ei,ENEMIES.length-1)];
  if(G.mode==='sub' && G.sub==='price'){
    if(E.presents){
      for(i=0;i<E.presents.length;i++){
        var Pz=E.presents[i];
        h+='<div class="it'+(Pz.wide?' wide':'')+'" data-k="p" data-i="'+i+'">'+Pz.nm
          +'<span class="c">'+Pz.ara+'</span></div>';
      }
    }else{
      var lab=['強気','適正','ゆずる','安売り'];
      for(i=0;i<E.prices.length;i++){
        h+='<div class="it" data-k="p" data-i="'+i+'">¥'+E.prices[i][0]
          +'<span class="c">'+lab[i]+'</span></div>';
      }
    }
    h+='<div class="it wide" data-k="back">もどる</div>';
  }else if(G.mode==='sub' && G.sub==='spell'){
    for(i=0;i<SPELLS.length;i++){
      var S=SPELLS[i];
      var no=(G.mp<S.mp || (S.once&&G.used[S.nm]))?' no':'';
      h+='<div class="it'+no+'" data-k="s" data-i="'+i+'">'+S.nm+'<span class="c">'+S.mp+'</span></div>';
    }
    h+='<div class="it" data-k="back">もどる</div>';
  }else{
    h+='<div class="it" data-k="price">'+(E.cmd||'みつもり')+'</div>';
    h+='<div class="it" data-k="guard">だんまり</div>';
    h+='<div class="it" data-k="spell">じゅもん</div>';
    h+='<div class="it" data-k="nige">にげる<span class="c">'+(TUNE.NIGE-G.nige)+'</span></div>';
  }
  c.innerHTML=h;
  c.className='win'+((G.q.length||(G.mode!=='cmd'&&G.mode!=='sub'))?' off':'')
                   +((G.mode==='sub'&&G.sub==='spell')?' sp':'');
  var its=c.querySelectorAll('.it');
  for(i=0;i<its.length;i++){
    (function(e){
      e.onclick=function(){
        var k=e.getAttribute('data-k'), idx=parseInt(e.getAttribute('data-i'),10);
        if(k==='back'){ G.mode='cmd'; G.sub=null; renderCmd(); return; }
        if(k==='price'){ G.sub='price'; G.mode='sub'; renderCmd(); return; }
        if(k==='spell'){ G.sub='spell'; G.mode='sub'; renderCmd(); return; }
        if(k==='p') doAction('price',idx);
        else if(k==='s') doAction('spell',idx);
        else doAction(k,0);
      };
    })(its[i]);
  }
}

/* =========================================================================
   戦闘
   ========================================================================= */
function startBattle(){
  var E=ENEMIES[G.ei];
  G.ehp=E.hp; G.guard=false; G.soft=0; G.used={}; G.help=0;
  G.showEnemy=true; CUR=E; FX.mode=''; G.boost=0; fxIn();
  say([['sys',E.head||('── 見積検討会　第'+(G.ei+1)+'ラウンド：'+E.short+' ──')],
       [E.cele?'good':'bad',E.nm+' が あらわれた！'],
       ['',E.say],
       ['sys',E.guchi],
       ['sys','（'+(E.weakNote||('弱点：'+ATTR_NM[E.weak]))+'）']]);
  G.mode='cmd'; G.sub=null;
  render(); flush();
}

function doAction(kind, idx){
  if(G.over || G.q.length) return;
  if(G.mode!=='cmd' && G.mode!=='sub') return;
  var E=ENEMIES[G.ei], dmg=0, weak=false, g=E.gauge||'なっとく';
  G.guard=false;
  G.mode='cmd'; G.sub=null;

  if(kind==='price' && E.presents){
    var Pz=E.presents[idx];
    G.gift=Pz.nm;
    dmg=Pz.dmg; G.ara+=Pz.ara;
    say([['yen','ミヤカワは 「'+Pz.nm+'」を さしだした！'],['',Pz.t],['good',Pz.r]]);
    if(G.boost){ dmg=Math.round(dmg*1.4); G.boost=0;
      say([['crit','── 誕生日 効果！　よけいに 効いた！']]); }
    say([['sys','（あらりが '+(-Pz.ara)+'。……まあ、こういう日は 使うもんだら）']]);

  }else if(kind==='price'){
    var P=E.prices[idx];
    G.tanka[G.ei]=P[0];
    dmg=P[1]; G.ara+=P[2];
    say([['yen','ミヤカワは 単価 ¥'+P[0]+' を 提示した！']]);
    if(P[2]<=-15){ G.yasu++; say([['bad','── 安い。安すぎる。あらりが '+(-P[2])+' 消し飛んだ。']]); }
    else if(P[2]<0){ say([['bad','── あらりが '+(-P[2])+' 削れた。']]); }
    else if(idx===0){ say([['sys','── 強気だ。相手の眉が 動いた。']]); G.soft=-1; }

  }else if(kind==='spell'){
    var S=SPELLS[idx];
    if(G.mp<S.mp) return;
    if(S.once && (G.used[S.nm]||G.gused[S.nm])) return;
    G.mp-=S.mp;
    if(S.once){ G.used[S.nm]=true; if(S.attr==='ruler'||S.attr==='kaigai') G.gused[S.nm]=true; }
    dmg=rnd(S.pw[0],S.pw[1]);
    weak=(S.attr===E.weak);
    say([['','ミヤカワは 「'+S.nm+'」を となえた！'],['',S.t],['sys',S.e]]);
    if(S.soft){ G.soft=S.soft; G.settai++; }
    if(S.mpback){ G.mp=Math.min(G.mpmax,G.mp+S.mpback);
      say([['good','こんきょが '+S.mpback+' もどった。']]); }
    if(S.attr==='ruler'){
      G.ruler++;
      if(G.help>0){ G.help--; say([['good','応援に来ていた 上役が、辞令とともに 消えた！']]); }
      else say([['good','担当の背後から、辞令の気配が した。']]);
      G.soft=Math.max(G.soft,2);
    }
    if(S.attr==='kaigai'){
      G.kaigai=true;
      say([['good','── 以後、『中国シフト』は 効かなくなった！']]);
    }
    if(S.ara){ G.ara+=S.ara;
      say([[S.ara>0?'good':'bad','あらりが '+(S.ara>0?'+':'')+S.ara+'。']]); }

  }else if(kind==='guard'){
    G.guard=true;
    say([['','ミヤカワは だんまりを 決めこんだ。'],
         ['sys','沈黙が 会議室に 落ちる。値段の話は、先に しゃべった方が 損だ。']]);
    G.mp=Math.min(G.mpmax,G.mp+3);
    if(Math.random()<TUNE.TALK){
      var d2=rnd(10,16); G.ehp-=d2;
      say([['good',E.nm+(E.guardline||'「……で、いくらなら いけるだ」')],
           ['dmg','── 相手が 先に しゃべった！　'+g+'が '+d2+' 動いた！']]);
    }

  }else if(kind==='nige'){
    if(E.cele){
      say([['','ミヤカワ「……いや、なんでもない」'],
           ['sys','タカハシ「なんだら それ」　── こんきょが 5 もどった。']]);
      G.mp=Math.min(G.mpmax,G.mp+5);
      G.mode='cmd'; flush(); render(); return;
    }
    G.nige++;
    say([['','ミヤカワ「……いったん 持ち帰らせてください」']]);
    if(G.nige>=TUNE.NIGE){
      say([['bad',E.nm+'「もう いいよ。他さんに 頼むわ」']]);
      G.mode='msg'; G.q.push(['__lost','']); flush(); render(); return;
    }
    G.ehp=Math.min(E.hp,G.ehp+10); G.mp=Math.min(G.mpmax,G.mp+9);
    say([['sys','持ち帰って 根拠を 作り直した。こんきょ +9、相手の '+g+' +10。']]);
    G.mode='cmd'; flush(); render(); return;
  }

  if(dmg>0){
    if(weak) dmg=Math.round(dmg*TUNE.WEAK);
    var crit=(Math.random()<TUNE.CRIT);
    if(crit){ dmg=Math.round(dmg*1.6); G.crit++; }
    G.ehp-=dmg;
    fxHit(weak,crit);
    if(crit) say([['crit',E.cele?'まっすぐ 届いた！':'根拠が ぐさりと 刺さった！']]);
    if(weak) say([['dmg','── 効果は ばつぐんだ！']]);
    say([['dmg',E.cele ? (E.nm+' の '+g+'が '+dmg+' あがった！')
                       : (E.nm+' の '+g+' に '+dmg+' の ダメージ！')]]);
    if(weak && G.ehp>0) say([['',E.hit]]);
  }

  if(G.ehp>0 && dmg>0 && Math.random()<TUNE.ALLY){
    var AL=E.cele?ALLIES_CELE:ALLIES;
    var A=AL[Math.floor(Math.random()*AL.length)];
    var ad=rnd(A.pw[0],A.pw[1]); G.ehp-=ad; G.ally++;
    say([['good',A.who+' の 『'+A.nm+'』'],['sys',A.t],
         ['dmg',E.cele ? (E.nm+' の '+g+'が '+ad+' あがった！')
                       : (E.nm+' に '+ad+' の ダメージ！')]]);
  }

  if(E.cele && G.ara<1) G.ara=1;   // 誕生日ラウンドでは 負けない

  if(G.ehp<=0){
    defeat(E);
    flush(); render(); return;
  }
    enemyTurn(E);
  flush(); render();
}

function defeat(E){
  G.showEnemy=false;
  var g=E.gauge||'なっとく';
  if(E.cele){
    fxCele(E);
    say([['dmg','── '+g+'が あふれた！'],
         ['crit','＊　'+g+' MAX！　＊'],
         ['good',E.win]]);
  }else{
    fxDie(E);
    say([['dmg','── '+g+'が 0 に なった！'],
         ['crit','＊　'+E.nm+' は くずれおちた！　＊'],
         ['good',E.nm+' を 説き伏せた！'],
         ['good','── '+E.win]]);
  }
  var back=Math.min(7,G.mpmax-G.mp);
  G.mp=Math.min(G.mpmax,G.mp+7);
  G.exp+=E.exp;
  say([['sys','──────────────'],
       ['dmg','ミヤカワたちは '+(E.expnm||'しんよう')+' '+E.exp+' を かくとくした！'],
       ['good','こんきょが '+back+' もどった。']]);
  /* 5連戦ぶんの しんよう：12→28→48→70→100（＋えがお24）。
     Lv2=第2戦後 / Lv3=第3戦後 / Lv4=第4戦後 / Lv5=最終戦（運搬・納品）後 */
  var need=[0,18,42,66,95,999][G.lv];
  if(G.exp>=need && G.lv<5){
    G.lv++;
    G.mpmax+=5; G.mp=G.mpmax;
    G.ara=Math.min(TUNE.ARA0,G.ara+TUNE.LVUP);
    say([['crit','＊　レベルが あがった！　ミヤカワは Lv'+G.lv+' に なった！　＊'],
         ['good','こんきょの さいだいちが 5 ふえた！　（'+G.mpmax+'）'],
         ['good','あらりが '+TUNE.LVUP+' もどった！']]);
    if(G.lv===2) say([['sys','── 値段の前に 根拠を出す、が 板についてきた。']]);
    if(G.lv===3) say([['sys','── 相手の眉が 動く瞬間が、見えるようになってきた。']]);
    if(G.lv===4) say([['sys','── 「それは いくらの手間か」が、すぐ 口から 出るようになった。']]);
    if(G.lv===5) say([['sys','── もう、この部屋で 気圧されることは ない。']]);
  }
  /* ランク判定は 見積が終わった時点の あらりで見る（お祝いの出費で 格を下げない） */
  if(!E.cele) G.araRank=G.ara;
  G.ei++; G.mode='msg';
  /* 通したのに あらりが 残っていない＝赤字受注。お祝いラウンドへは 進ませない */
  if(!E.cele && G.ara<=0){ G.q.push(['__over','']); return; }
  G.q.push([(G.ei>=ENEMIES.length)?'__end':'__next','']);
}

function enemyTurn(E){
  var g=E.gauge||'なっとく';
  if(!E.cele && Math.random()<TUNE.SPONGE){
    var big=(Math.random()<0.45);
    if(big){
      var m2=rnd(6,9); G.mp=Math.max(0,G.mp-m2);
      say([['sp','スポンジマン の 『スポンジ吸引』！'],
           ['sp','（黄色い体が ふくらむ。根拠が 音を立てて 吸われていく）'],
           ['sp','こんきょを '+m2+' うしなった！']]);
    }else{
      G.mp=Math.max(0,G.mp-3);
      say([['sp','スポンジマン「そのはなしは あとでね。いま 忙しいでしょ」'],
           ['sp','── まとめる時間が 吸い取られた。こんきょ -3。']]);
    }
    G.sponge++;
  }else{
    var key=E.skills[Math.floor(Math.random()*E.skills.length)];
    var S=SKILLS[key];
    if(key==='china' && G.kaigai){
      say([['good',E.nm+' は 中国シフトを 言いかけて、やめた。'],
           ['good','「……そっちも 向こうに 工場 作ったんだったね」']]);
      G.mode='cmd'; return;
    }
    say([[E.cele?'':'bad',E.nm+' の 『'+S.nm+'』！'],['',S.line]]);
    if(S.call){
      if(G.help<2){
        G.help++;
        say([['bad',(G.help===1?'カチョウ':'ブチョウ')+' が あらわれた！'],
             ['bad','── 相手の 押しが 強くなった。']]);
        G.ehp=Math.min(E.hp,G.ehp+6);
        say([['bad',g+'が 6 回復！']]);
      }else{
        say([['sys','……これ以上 呼べる人が いなかった。']]);
      }
    }else{
      var d=rnd(S.dmg[0],S.dmg[1]);
      d=Math.round(d*(1+TUNE.HELP*G.help));
      if(G.soft>0){ d=Math.round(d*0.5); G.soft--; }
      else if(G.soft<0){ d=Math.round(d*1.3); G.soft=0; }
      if(G.guard){ d=Math.round(d*0.45); }
      if(d>0){ G.ara-=d; fxAtk(); say([['bad','あらりを '+d+' うしなった！']]); }
      if(S.mp){ var m=G.guard?Math.round(S.mp/2):S.mp; G.mp=Math.max(0,G.mp-m);
        say([['bad','こんきょを '+m+' うしなった！']]); }
      if(S.heal){ G.ehp=Math.min(E.hp,G.ehp+S.heal);
        say([['bad',E.cele ? ('── 目利きに 見抜かれた。'+g+'が '+S.heal+' さがった。')
                           : ('表彰状を 受け取ってしまった。'+g+'が '+S.heal+' 回復！')]]); }
      if(S.araback){ G.ara=Math.min(TUNE.ARA0,G.ara+S.araback);
        say([['good','── うまい。……あらりが '+S.araback+' もどった。']]); }
      if(S.boost){ G.boost=1;
        say([['good','── つぎの プレゼントが、よけいに 効きそうだ。']]); }
    }
  }
  if(E.cele){ if(G.ara<1) G.ara=1; G.mode='cmd'; return; }
  if(G.ara<=0){ G.mode='msg'; G.q.push(['__over','']); return; }
  if(G.ara<=30) say([['bad','── あらりが あぶない！']]);
  G.mode='cmd';
}

function advance(){
  if(!G.q.length) return;
  var h=G.q[0];
  if(h[0]==='__next'){ G.q.shift(); startBattle(); return; }
  if(h[0]==='__end'){  G.q.shift(); ending('win');  return; }
  if(h[0]==='__over'){ G.q.shift(); ending('aka');  return; }
  if(h[0]==='__lost'){ G.q.shift(); ending('lost'); return; }
  flush(); render();
}

/* =========================================================================
   結末
   ========================================================================= */
function ending(kind){
  G.over=true; G.mode='end';
  var rank,mes,win=(kind==='win');
  /* ランクは「見積が終わった時点」の あらりで決める。お祝いの出費で 格を下げない */
  var ra=(G.araRank===null||G.araRank===undefined)?G.ara:G.araRank;
  if(kind==='aka'){
    rank='あ か じ 受 注';
    mes='見積は通った。だが 通した中身は 原価を割っている。'
       +'作れば作るほど 減っていく仕事を、これから 1年 抱える。';
  }else if(kind==='lost'){
    rank='失　注';
    mes='持ち帰りを 重ねすぎた。話は 他社へ流れた。'
       +'──ただ、赤字で受けるよりは まし、かもしれない。';
  }else if(ra>=TUNE.RANK[0]){ rank='天 下 布 武';
    mes=nProcAll()+'工程ぶんの単価が、すべて 根拠つきで通った。値引きではなく、工夫で勝った見積だ。'; }
  else if(ra>=TUNE.RANK[1]){ rank='惣 無 事 令';
    mes='通った。多少 削られたが、作れば ちゃんと残る見積になっている。'; }
  else if(ra>=TUNE.RANK[2]){ rank='一 国 一 城';
    mes='通りはした。ただ ここから ひとつ 手が狂えば 消える薄さだ。'; }
  else{ rank='薄 氷';
    mes='通った。……この単価で 来年も同じ話をするのかと思うと、少し 遠い目になる。'; }

  var h='';
  h+='<h2>'+(win?'見積、承認':(kind==='lost'?'商談、終了':'見積検討会、終了'))+'</h2>';
  h+='<div class="rank">'+rank+'</div>';
  h+='<table>';
  var nProc=nProcAll();                       // 番外（お誕生日）は 工程に数えない
  h+='<tr><td>勝ち取った工程</td><td>'+Math.min(G.ei,nProc)+' / '+nProc+'</td></tr>';
  if(G.gift) h+='<tr><td>おくりもの</td><td>'+G.gift+'</td></tr>';
  h+='<tr><td>ミヤカワ</td><td>Lv'+G.lv+'（しんよう '+G.exp+'）</td></tr>';
  h+='<tr><td>残ったあらり</td><td>'+Math.max(0,G.ara)+' / '+TUNE.ARA0+'</td></tr>';
  h+='<tr><td>残ったこんきょ</td><td>'+Math.max(0,G.mp)+' / '+G.mpmax+'</td></tr>';
  h+='<tr><td>提示した単価</td><td>'+(G.tanka.filter(function(x){return x;}).map(function(x){return '¥'+x;}).join(' / ')||'─')+'</td></tr>';
  h+='<tr><td>根拠が刺さった回数</td><td>'+G.crit+' 回</td></tr>';
  h+='<tr><td>安売りした回数</td><td>'+G.yasu+' 回</td></tr>';
  h+='<tr><td>接待した回数</td><td>'+G.settai+' 回</td></tr>';
  h+='<tr><td>仲間の助太刀</td><td>'+G.ally+' 回</td></tr>';
  h+='<tr><td>転勤させた回数</td><td>'+G.ruler+' 回</td></tr>';
  h+='<tr><td>持ち帰った回数</td><td>'+G.nige+' 回</td></tr>';
  h+='<tr><td>スポンジマンの妨害</td><td>'+G.sponge+' 回</td></tr>';
  h+='</table>';
  h+='<p>'+mes+'</p>';

  if(win){
    h+='<p class="sp">──帰りの車。助手席に、黄色い着ぐるみが 座っていた。</p>';
    h+='<p class="sp">スポンジマン「きょうは ぼく、じゃまだった？」</p>';
    h+='<p class="sp">こんきょ（根拠）は、いつも あとまわしにされる。'
      +'実績原価をまとめる時間、工数を測る時間、不良の記録を残す時間。'
      +'「いま忙しいでしょ」と 吸い取られ、気づけば 値段の話だけが 残っている。</p>';
    h+='<p class="sp">──<b>生産性悪化の権化</b>は、見積の前日にこそ 隣に立っている。</p>';
    h+='<p>ミヤカワ「文句ばっかり言ってる、て言われるけどね。</p>';
    h+='<p style="margin-left:1em">……いちばん現場のこと考えてるもんで、文句が出るだら」</p>';
    h+='<p style="color:#ffd24a;margin-top:10px">──そして 会議室の机に、ケーキが 出てきた。</p>';
    h+='<p style="color:#ffd24a">4人「タカハシくん、お誕生日 おめでとう！」</p>';
    h+='<p>タカハシ「もう。……びっくりするだら」</p>';
    h+='<p style="text-align:center;color:#7fd6a2;margin-top:10px">そして一行は、ケーキを切り分けて、木曜日の練習場へ向かった。</p>';
  }
  h+='<p style="text-align:center;color:#ffe14a;margin-top:10px">— 見積もりクエスト・完 —</p>';

  if(vi&&vl){ vi.innerHTML=h; vl.classList.remove('hide');

}

/* =========================================================================
   敵の絵と 演出（320×168 ドット絵）
   ------------------------------------------------------------------------
   FX.mode : ''(通常) / 'hit'(こちらの一撃) / 'atk'(敵の攻撃) /
             'die'(撃破＝点滅→砕け散る→白フラッシュ) / 'in'(敵の登場)
   ========================================================================= */
var cv=null,cx=null,CUR=null;
var FX={mode:'',t:0,dur:0,shake:0,flash:0,tint:null,parts:[],big:false};
var RAF=(typeof requestAnimationFrame==='function')?requestAnimationFrame:null;

function px(x,y,w,h,c){ cx.fillStyle=c; cx.fillRect(x,y,w,h); }

/* --- 演出の起動 --- */
function fxHit(weak,crit){
  FX.mode='hit'; FX.t=0; FX.dur=crit?20:13; FX.shake=crit?9:(weak?7:4);
  FX.flash=crit?0.55:(weak?0.4:0.18); FX.tint=crit?'#ff9a4a':(weak?'#ffe14a':'#ffffff');
  FX.big=!!crit; startFx();
}
function fxAtk(){
  FX.mode='atk'; FX.t=0; FX.dur=16; FX.shake=8; FX.flash=0.42; FX.tint='#ff3a2a'; startFx();
}
function fxIn(){
  FX.mode='in'; FX.t=0; FX.dur=26; FX.shake=0; FX.flash=0; FX.tint=null; startFx();
}
function fxDie(E){
  CUR=E; FX.mode='die'; FX.t=0; FX.dur=104; FX.shake=5; FX.flash=0; FX.tint='#ffffff';
  FX.parts=makeParts(E); startFx();
}
/* 撃破ではなく お祝い。紙吹雪と ハートが 舞い上がる */
function fxCele(E){
  CUR=E; FX.mode='cele'; FX.t=0; FX.dur=132; FX.shake=0; FX.flash=0; FX.tint='#ffe14a';
  FX.parts=makeCele(); startFx();
}
function makeCele(){
  var pal=['#ffd24a','#ff8ab0','#7fd6a2','#8ad0ff','#ffffff','#ff5a7a','#ffa8d0'], a=[], i;
  for(i=0;i<72;i++){
    a.push({x:14+Math.random()*292, y:150+Math.random()*46,
            vx:(Math.random()*2-1)*0.7, vy:-(1.0+Math.random()*2.3),
            s:3+Math.floor(Math.random()*4),
            c:pal[i%pal.length], h:(i%4===0), w:Math.random()*6.28});
  }
  return a;
}
function drawCele(){
  var i,p;
  for(i=0;i<FX.parts.length;i++){
    p=FX.parts[i];
    p.w+=0.16; p.x+=p.vx+Math.sin(p.w)*0.7; p.y+=p.vy; p.vy+=0.008;
    var al=Math.min(1,Math.max(0,1-(FX.t-84)/48));
    if(al<=0) continue;
    cx.save(); cx.globalAlpha=al;
    if(p.h) drawHeart(Math.round(p.x),Math.round(p.y),Math.max(1,Math.round(p.s/2)),p.c);
    else px(Math.round(p.x),Math.round(p.y),Math.round(p.s),Math.round(p.s*1.4),p.c);
    cx.restore();
  }
}
function drawHeart(x,y,u,c){
  px(x+u,   y,     2*u, u, c); px(x+4*u, y,     2*u, u, c);
  px(x,     y+u,   7*u, 2*u, c);
  px(x+u,   y+3*u, 5*u, u, c);
  px(x+2*u, y+4*u, 3*u, u, c);
  px(x+3*u, y+5*u, u,   u, c);
}
function makeParts(E){
  var pal=PALETTE[E.sp]||PALETTE.calc, a=[],i;
  for(i=0;i<74;i++){
    var ang=Math.random()*Math.PI*2, sp=1.6+Math.random()*4.4;
    a.push({x:160+(Math.random()*116-58), y:74+(Math.random()*104-52),
            vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-3.4,
            s:4+Math.floor(Math.random()*8),
            c:pal[Math.floor(Math.random()*pal.length)], r:Math.random()*0.5-0.25});
  }
  return a;
}
function loop(){
  drawScene();
  if(FX.mode && FX.t<FX.dur){
    FX.t++;
    if(RAF){ FX.running=true; RAF(loop); }
    else { FX.t=FX.dur; FX.mode=''; FX.running=false; }
  }else if(FX.mode){
    if(FX.mode==='die'||FX.mode==='cele') CUR=null;   // 出番の済んだ相手は 引っこむ
    FX.mode=''; FX.parts=[]; FX.running=false; drawScene();
  }else{ FX.running=false; }
}
function startFx(){ if(!FX.running) loop(); }   // 演出の二重回しを 防ぐ

/* --- 画面 --- */
function drawScene(){
  if(!cx) return;
  var E=CUR;
  cx.save();
  px(0,0,320,168,'#000');

  var sh=0;
  if(FX.shake && FX.mode){
    var k=1-(FX.t/FX.dur);
    sh=Math.round((Math.random()*2-1)*FX.shake*k);
    cx.translate(sh, (FX.mode==='atk')?Math.round((Math.random()*2-1)*FX.shake*k):0);
  }
  px(-20,142,360,2,'#333');

  if(E){
    if(FX.mode==='die'){
      if(FX.t<34){                                   // ① 点滅しながら 揺れる
        if(Math.floor(FX.t/3)%2===0) drawBody(E);
        else { drawBody(E); tintSprite('#ffffff',0.85); }
      }else{                                         // ② 砕けて 飛び散る
        drawParts();
      }
    }else if(FX.mode==='cele'){                      // お祝い：本人は そのまま、紙吹雪が 舞う
      drawBody(E);
      drawCele();
    }else if(FX.mode==='in'){                        // 登場：4回 点滅
      if(Math.floor(FX.t/4)%2===0) drawBody(E);
    }else{
      drawBody(E);
      if(FX.mode==='hit' && FX.t<7) tintSprite(FX.tint, FX.big?0.9:0.65);
    }
  }
  cx.restore();

  /* 全画面フラッシュ */
  var f=0;
  if(FX.mode==='hit'||FX.mode==='atk') f=FX.flash*(1-FX.t/FX.dur);
  if(FX.mode==='die'){
    if(FX.t>=30&&FX.t<40) f=1.0-(FX.t-30)/10*0.35;   // 砕ける瞬間の 白フラッシュ
    else if(FX.t>=40)     f=Math.max(0,0.4-(FX.t-40)/60);
  }
  if(FX.mode==='cele'){                              // 白フラッシュではなく やさしい黄色
    if(FX.t<26) f=0.30*(1-FX.t/26);
  }
  if(f>0){
    cx.save(); cx.globalAlpha=Math.min(1,f);
    cx.fillStyle=(FX.mode==='atk')?'#ff3a2a':((FX.mode==='cele')?'#ffe6a0':'#ffffff');
    cx.fillRect(0,0,320,168); cx.restore();
  }

  if(E && !(FX.mode==='die'&&FX.t>=34)){
    cx.fillStyle='#9a9a9a'; cx.font='11px "MS Gothic", monospace';
    cx.fillText(E.nm, 8, 162);
  }
  if(FX.mode==='die' && FX.t>=44){
    cx.fillStyle='#ffe14a'; cx.font='13px "MS Gothic", monospace';
    cx.fillText((CUR&&CUR.gauge?CUR.gauge:'なっとく')+' 0 ！', 108, 88);
  }
  if(FX.mode==='cele' && FX.t>=20){
    cx.fillStyle='#ffe14a'; cx.font='13px "MS Gothic", monospace';
    cx.fillText('＊ よろこび MAX！ ＊', 88, 26);
  }
}
function tintSprite(c,a){                            // 描いた絵の上だけを 染める
  cx.save(); cx.globalCompositeOperation='source-atop';
  cx.globalAlpha=a; cx.fillStyle=c; cx.fillRect(0,0,320,168); cx.restore();
}
function drawParts(){
  var i,p;
  for(i=0;i<FX.parts.length;i++){
    p=FX.parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.24; p.s=Math.max(1,p.s-0.045);
    var al=Math.max(0,1-(FX.t-34)/62);
    if(al<=0) continue;
    cx.save(); cx.globalAlpha=al; px(Math.round(p.x),Math.round(p.y),Math.round(p.s),Math.round(p.s),p.c); cx.restore();
  }
}

    px(X-16,Y-4,10,11,'#ffe14a');  px(X+7,Y-4,10,11,'#ffe14a');

    px(X-58,Y-30,10,32,FR); px(X+48,Y-30,10,32,FR); // 腕がわりの支柱
    px(X-46,Y+54,16,12,FR2); px(X+30,Y+54,16,12,FR2);              // 脚
  }else if(E.sp==='takahashi'){             // タカハシくん（野菜ソムリエ・お誕生日）
    var HR='#7a4a28', HR2='#96602f', SK='#f2cda2', SH='#8a2a3a', SH2='#a8394b', AP='#17171c';

    px(X-8,Y+10,4,6,'#fff'); px(X+4,Y+10,4,6,'#fff');
